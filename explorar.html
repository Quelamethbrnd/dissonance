<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar - DISSONANCE</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <link rel="stylesheet" href="style-explorar.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">

        <header class="main-header">
            <h1 class="main-title">DISSONANCE</h1>
        </header>

        <nav class="navbar">
            <div class="nav-user-greeting">
                <span>Olá, <strong>@ouvinte</strong></span>
            </div>
            <div class="nav-links">
                <a href="home.html" class="nav-item">Feed</a>
                <a href="explorar.html" class="nav-item active">Explorar</a>
                <a href="perfil.html" class="nav-item">Perfil</a>
                <a href="index.html" class="nav-item btn-logout">Sair</a>
            </div>
        </nav>

        <main class="explore-container">
            <!-- Barra de Busca e Filtros -->
            <section class="explore-controls">
                <div class="search-box-wrapper">
                    <input type="text" id="explore-search" placeholder="Buscar por álbum, artista ou gênero...">
                </div>
                <div class="genre-filters" id="genre-filters-container">
                    <button type="button" class="filter-btn active" data-genre="todos">Todos</button>
                </div>

            </section>

            <!-- Seção 1: Mais Comentados / Avaliados pela Comunidade -->
            <section class="explore-section">
                <h2 class="section-heading">EM ALTA NA COMUNIDADE</h2>
                <div class="albums-grid" id="community-trending-grid"></div>
            </section>

            <!-- Seção 2: Catálogo para Descobrir -->
            <section class="explore-section">
                <h2 class="section-heading">DESCOBRIR NOVOS SONS</h2>
                <div class="albums-grid" id="catalog-grid"></div>
            </section>
        </main>


    </div>

    <script src="explorar.js"></script>
    <script src="tema.js"></script>

</body>

</html>
