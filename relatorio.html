<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dissonance — Relatório de Tracking</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-home.css">
    <style>
        .report-wrapper {
            padding: 24px 30px 40px 30px;
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #000000;
        }
        .section-heading {
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }
        .individual-apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 34px;
        }
        .app-stat-card {
            background: var(--card-bg, #ffffff);
            border: 2px solid #000000;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 4px 4px 0px #000000;
        }
        .app-stat-card.disconnected {
            opacity: 0.7;
            background: #f4f4f4;
        }
        .app-badge {
            display: inline-block;
            padding: 4px 10px;
            border: 2px solid #000000;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.8rem;
        }
        .mini-rank-list {
            list-style: none;
            padding: 0;
            margin-top: 8px;
        }
        .mini-rank-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.12);
            font-size: 0.86rem;
            gap: 8px;
        }
        .total-report-box {
            background: var(--card-bg, #ffffff);
            border: 2px solid #000000;
            border-radius: 10px;
            padding: 22px;
            box-shadow: 5px 5px 0px #000000;
        }
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin: 16px 0 24px 0;
        }
        .kpi-card {
            background: var(--btn-pink, #f7bbd7);
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 14px 10px;
            text-align: center;
        }
        .kpi-card strong {
            display: block;
            font-size: 1.35rem;
            font-weight: 900;
            margin-bottom: 2px;
        }
        .kpi-card span {
            font-size: 0.75rem;
            font-weight: 800;
        }
        .combined-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .bar-wrap {
            margin-bottom: 12px;
        }
        .bar-label {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 4px;
        }
        .bar-track {
            width: 100%;
            height: 12px;
            background: #e9ecef;
            border: 2px solid #000000;
            border-radius: 6px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: var(--btn-pink, #f7bbd7);
        }
        @media (max-width: 900px) {
            .individual-apps-grid { grid-template-columns: 1fr; }
            .kpi-row { grid-template-columns: repeat(2, 1fr); }
            .combined-columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header style="background:#000000; padding:24px 32px; text-align:right; border-bottom:2px solid #000000;">
            <h1 style="margin:0; font-size:2rem; letter-spacing:3px; color:var(--btn-pink, #f7bbd7);">DISSONANCE</h1>
        </header>

        <nav class="navbar">
            <div class="nav-brand">
                <span class="nav-user-greeting">Olá, <strong>@ouvinte</strong></span>
            </div>
            <div class="nav-links">
                <a href="home.html" class="nav-item">Feed</a>
                <a href="explorar.html" class="nav-item">Explorar</a>
                <a href="perfil.html" class="nav-item">Perfil</a>
                <a href="relatorio.html" class="nav-item active">Relatório</a>
                <a href="index.html" class="nav-item btn-logout">Sair</a>
            </div>
        </nav>

        <main class="report-wrapper">
            <div class="report-header">
                <div>
                    <h2 style="font-size:1.6rem; margin:0;">RELATÓRIO DE TRACKING</h2>
                    <p style="opacity:0.8; margin-top:4px; font-size:0.9rem;">Estatísticas individuais por plataforma e consolidado geral da sua conta.</p>
                </div>
                <a href="home.html" style="padding:8px 14px; border:2px solid #000; border-radius:6px; background:var(--btn-pink,#f7bbd7); color:#000; font-weight:800; text-decoration:none; box-shadow:3px 3px 0 #000;">← Gerenciar Conexões</a>
            </div>

            <h3 class="section-heading">1. ESTATÍSTICAS INDIVIDUAIS POR PLATAFORMA</h3>
            <section id="individual-apps-grid" class="individual-apps-grid"></section>

            <h3 class="section-heading">2. CONSOLIDADO GERAL (TODOS OS APPS CONECTADOS SOMADOS)</h3>
            <section id="combined-report-section" class="total-report-box"></section>
        </main>
    </div>

    <script src="tema.js"></script>
    <script src="relatorio.js"></script>
</body>
</html>
