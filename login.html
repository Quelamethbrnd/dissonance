<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DISSONANCE</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="top-navbar">
        <a href="index.html" class="brand-logo">DISSONANCE</a>
        <div class="nav-links">
            <a href="index.html" class="nav-item">Início</a>
            <a href="login.html" class="nav-item active">Entrar</a>
            <a href="cadastro.html" class="nav-item">Cadastrar</a>
        </div>
    </nav>

    <div class="login-container">
        <header class="login-header">
            <h2 class="login-title">ENTRAR</h2>
        </header>

        <form class="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Sua senha" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Lembrar de mim
                </label>
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-login">Entrar ▸</button>
                <p class="register-text">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </form>
    </div>

    <script src="https://unpkg.com"></script>
    <script src="auth.js"></script>
</body>
</html>
