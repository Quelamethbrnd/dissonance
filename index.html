<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISSONANCE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body>

    <div class="app-container">

        <header class="main-header">
            <h1 class="main-title">DISSONANCE</h1>
        </header>

        <nav class="navbar">
            <div class="nav-links">
                <a href="index.html" class="nav-item active">Início</a>
                <a href="login.html" class="nav-item">Entrar</a>
                <a href="cadastro.html" class="nav-item">Cadastrar</a>
            </div>
        </nav>

        <div class="page-layout">

            <aside class="sidebar-illustrations">
                <div class="illustration-box">
                    <img src="imgs/sidebar angel.jpg" alt="Silhueta Anjo" class="img-sidebar">
                    <img src="imgs/sidebarbanda.jpg" alt="Silhueta Banda" class="img-sidebar">
                </div>
            </aside>

            <main class="main-content">

                <p class="slogan-text">
                    Descubra, dê reviews, interaja com a comunidade e esteja em sintonia com suas músicas no Dissonance!
                </p>

                <div class="marquee-container">
                    <div class="marquee-track">
                        <article class="album-card"><img src="imgs/Mitskipuberty2.jpg" alt="Puberty 2 - Mitski">
                        </article>
                        <article class="album-card"><img src="imgs/Blonde_-_Frank_Ocean.jpeg" alt="Blond - Frank Ocean">
                        </article>
                        <article class="album-card"><img src="imgs/Radiohead_-_In_Rainbows.jpg"
                                alt="In Rainbows - Radiohead"></article>
                        <article class="album-card"><img src="imgs/Kendrick_Lamar_-_Damn.png"
                                alt="DAMN - Kendrick Lamar"></article>
                    </div>

                    <div class="marquee-track" aria-hidden="true">
                        <article class="album-card"><img src="imgs/Mitskipuberty2.jpg" alt="Puberty 2 - Mitski">
                        </article>
                        <article class="album-card"><img src="imgs/Blonde_-_Frank_Ocean.jpeg" alt="Blond - Frank Ocean">
                        </article>
                        <article class="album-card"><img src="imgs/Radiohead_-_In_Rainbows.jpg"
                                alt="In Rainbows - Radiohead"></article>
                        <article class="album-card"><img src="imgs/Kendrick_Lamar_-_Damn.png"
                                alt="DAMN - Kendrick Lamar"></article>
                    </div>
                </div>

                <div class="action-container">
                    <a href="cadastro.html" class="btn-discover">Começar agora ▸</a>
                </div>

            </main>

        </div>

    </div>

</body>

</html>
