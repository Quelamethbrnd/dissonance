<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta Confirmada - Em Frequência Com Você</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <link rel="stylesheet" href="style-confirmacao.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="confirm-container">

        <header class="confirm-header">
            <h2 class="confirm-title">QUASE LÁ!</h2>
        </header>

        <main class="confirm-content">
            <div class="icon-badge">✉</div>

            <h3 class="status-heading">Verifique seu e-mail</h3>

            <p class="status-text">
                Enviamos um link de confirmação para o endereço cadastrado. Clique no link para ativar sua conta e
                começar a avaliar seus álbuns favoritos.
            </p>

            <div class="status-box">
                <p>Não recebeu? Verifique a caixa de spam ou <a href="#">reenvie o e-mail</a>.</p>
            </div>

            <a href="login.html" class="btn-go-login">Ir para o Login ▸</a>
        </main>

    </div>

</body>

</html>
