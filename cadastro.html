<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Em Frequência Com Você</title>
    <link rel="stylesheet" href="style-cadastro.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="register-container">
        <header class="register-header">
            <h2 class="register-title">CRIAR CONTA</h2>
        </header>

        <form class="register-form">
            <div class="input-group">
                <label for="fullname">Nome Completo</label>
                <input type="text" id="fullname" name="fullname" placeholder="Seu nome completo" required>
            </div>

            <div class="input-group">
                <label for="username">Nome de Usuário</label>
                <input type="text" id="username" name="username" placeholder="ex: @user123" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Crie uma senha forte" required>
            </div>

            <div class="form-options">
                <label class="terms-label">
                    <input type="checkbox" name="terms" required> Aceito os <a href="termos.html">Termos de Uso</a>
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-register">Cadastrar ▸</button>
                <p class="login-text">Já tem uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </form>
    </div>

    <script src="https://jsdelivr.net"></script>
    <script src="auth.js"></script>

</body>

</html>
