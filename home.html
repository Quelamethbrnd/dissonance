<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - DISSONANCE</title>
    <link rel="stylesheet" href="style-home.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">

        <header class="main-header">
            <h1 class="main-title">DISSONANCE</h1>
        </header>

        <nav class="navbar">
            <div class="nav-user-greeting">
                <span>Olá, <strong>@ouvinte</strong></span>
            </div>
            <div class="nav-links">
                <a href="home.html" class="nav-item active">Feed</a>
                <a href="explorar.html" class="nav-item">Explorar</a>
                <a href="perfil.html" class="nav-item">Perfil</a>
                <a href="index.html" class="nav-item btn-logout">Sair</a>
            </div>
        </nav>

        <div class="page-layout">
            
            <aside class="sidebar-dashboard">
                
                <div class="profile-summary">
                    <div class="avatar-circle">🎧</div>
                    <h3>@ouvinte</h3>
                    <p class="user-bio">Em sintonia com indie, R&B e rock alternativo.</p>
                </div>

                <div class="tracking-card">
                    <div class="tracking-header">
                        <span class="live-dot"></span> OUVINDO AGORA
                    </div>
                    <div class="now-playing">
                        <img src="imgs/Blonde_-_Frank_Ocean.jpeg" alt="Capa Blond">
                        <div class="track-info">
                            <strong>Nights</strong>
                            <span>Frank Ocean</span>
                            <small class="platform-tag">via Spotify</small>
                        </div>
                    </div>
                </div>

                <div class="connections-box">
                    <h4>CONEXÕES DE TRACKING</h4>
                    <button class="btn-platform connected">✓ Spotify Conectado</button>
                    <button class="btn-platform">+ Conectar Apple Music</button>
                    <button class="btn-platform">+ Conectar SoundCloud</button>
                </div>

            </aside>

            <main class="main-feed">
                
                <section class="new-review-box">
                    <h3>O que você está ouvindo?</h3>
                    <form class="review-form">
                        <div class="review-inputs-top">
                            <input type="text" placeholder="Nome do Álbum ou Música..." required>
                            <select name="rating" aria-label="Nota">
                                <option value="5">★★★★★ (5.0)</option>
                                <option value="4">★★★★☆ (4.0)</option>
                                <option value="3">★★★☆☆ (3.0)</option>
                                <option value="2">★★☆☆☆ (2.0)</option>
                                <option value="1">★☆☆☆☆ (1.0)</option>
                            </select>
                        </div>
                        <textarea rows="3" placeholder="Escreva sua review e compartilhe com a comunidade..." required></textarea>
                        <div class="review-form-footer">
                            <button type="submit" class="btn-post-review">Publicar Review ▸</button>
                        </div>
                    </form>
                </section>

                <section class="feed-list">
                    <h3 class="feed-section-title">ATIVIDADE DA COMUNIDADE</h3>
                </section>

            </main>

        </div>

    </div>

    <script src="feed.js"></script>
    <script src="tema.js"></script>
    
</body>
</html>
