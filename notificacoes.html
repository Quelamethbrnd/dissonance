<head>
    <meta charset="UTF-8">

    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-notificacoes.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body>

    <div class="app-container">

        <header class="main-header">
            <h1 class="main-title">DISSONANCE</h1>
        </header>

        <nav class="navbar">
            <div class="nav-user-greeting">
                <span>Olá, <strong>@ouvinte</strong></span>
            </div>
            <div class="nav-links">
                <a href="home.html" class="nav-item">Feed</a>
                <a href="explorar.html" class="nav-item">Explorar</a>
                <a href="perfil.html" class="nav-item">Perfil</a>
                <a href="relatorio.html" class="nav-item">Relatório</a>
                <a href="notificacoes.html" class="nav-item active">Notificações</a>
                <a href="index.html" class="nav-item btn-logout">Sair</a>
            </div>
        </nav>

        <main class="notif-container">
            <div class="notif-header-row">
                <h2>ATIVIDADE E NOTIFICAÇÕES</h2>
                <div class="notif-actions-top">
                    <button type="button" id="btn-mark-all-read" class="btn-notif-action">Marcar todas como lidas ✓</button>
                    <button type="button" id="btn-clear-notifs" class="btn-notif-clear">Limpar</button>
                </div>
            </div>

            <div class="notif-filters">
                <button type="button" class="notif-filter-btn active" data-filter="todas">Todas</button>
                <button type="button" class="notif-filter-btn" data-filter="like">♥ Curtidas</button>
                <button type="button" class="notif-filter-btn" data-filter="comment">💬 Comentários</button>
                <button type="button" class="notif-filter-btn" data-filter="follow">+ Seguidores</button>
            </div>

            <div id="notifications-list" class="notifications-list"></div>
        </main>

    </div>

    <script src="notificacoes.js"></script>
    <script src="tema.js"></script>

</body>
